name: Deploy

# Auto-deploy to the home NixOS server after CI passes on main.
# Server-side prerequisites — see docs/deploy-nixos.md.
# Only uses GitHub-provided secrets (no untrusted user input).

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /home/admin/telegram-bot-business-card
            echo "=== Deploy started at $(date -Is) ==="
            git fetch --prune origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker compose ps
            docker compose logs --tail 30 bot
            echo "=== Deploy finished at $(date -Is) ==="
