name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy bot

      - name: Tests
        # TODO: raise to 60% when handler integration tests unfreeze (Router single-use limit)
        run: uv run pytest -v --cov=bot --cov-report=xml --cov-fail-under=50

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: telegram-bot-business-card:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        env:
          BOT_TOKEN: "123456789:AAH-test-token-for-smoke-test-only"
          ADMIN_IDS: "[123456789]"
        run: |
          docker run --rm \
            -e BOT_TOKEN \
            -e ADMIN_IDS \
            --entrypoint python telegram-bot-business-card:test \
            -c "import bot; import bot.startup; print('smoke OK')"
