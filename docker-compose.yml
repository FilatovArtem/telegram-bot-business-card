services:
  bot:
    build: .
    image: telegram-bot-business-card:latest
    container_name: sweetdream-bot
    env_file: .env
    # network_mode: host lets the bot reach a host-local proxy
    # (e.g. xray on 127.0.0.1:10808) for environments where api.telegram.org
    # is blocked by the ISP and Telegram requests must go through a proxy.
    # Safe for this MVP: bot uses outbound only (long polling), no inbound ports.
    network_mode: host
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python -m bot"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Postgres profile — run with: docker compose --profile postgres up
  postgres:
    image: postgres:16-alpine
    container_name: sweetdream-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      POSTGRES_DB: ${POSTGRES_DB:-bot}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  bot-data:
  pg-data:
