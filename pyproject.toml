[project]
name = "telegram-bot-business-card"
version = "0.1.0"
description = "Telegram bot for business: catalog, booking, admin panel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.0,<3",
    "alembic>=1.14,<2",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "A", "SIM", "PT", "RUF", "S"]
ignore = [
    "ANN401",
    "S101",
    "RUF001",  # false-positive for Cyrillic text in Russian-language bot
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ANN201", "E501"]
"migrations/*" = ["ANN", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = []

[[tool.mypy.overrides]]
module = ["aiogram.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=bot",
    "--cov-report=term-missing",
    "--cov-fail-under=50",
]

[tool.coverage.run]
source = ["bot"]
omit = ["bot/__main__.py", "bot/startup.py", "migrations/*"]
