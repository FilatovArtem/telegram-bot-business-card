repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^bot/
        additional_dependencies:
          - aiogram>=3.13
          - sqlalchemy[asyncio]>=2.0
          - pydantic-settings>=2.0
          - alembic>=1.14
